<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <!-- خط عربي من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
  <!-- مكتبة Canvas Confetti للتأثيرات -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle, #2b0813 0%, #0f0206 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* الخلفية والغيوم المضيئة */
    .bg-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: rgba(255, 43, 91, 0.25);
      filter: blur(100px);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    /* حاوية المحتوى الرئيسي */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 60px;
    }

    .title {
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #ffb3c1;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    /* تصميم القلب التفاعلي */
    .heart-wrapper {
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 30px 0;
    }

    .heart {
      width: 100px;
      height: 100px;
      background-color: #ff2a5f;
      display: inline-block;
      transform: rotate(-45deg);
      position: relative;
      filter: drop-shadow(0 0 25px rgba(255, 42, 95, 0.8));
      animation: heartBeat 1.2s infinite ease-in-out;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 100px;
      height: 100px;
      background-color: #ff2a5f;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -50px;
      left: 0;
    }

    .heart::after {
      left: 50px;
      top: 0;
    }

    @keyframes heartBeat {
      0% { transform: scale(1) rotate(-45deg); }
      14% { transform: scale(1.15) rotate(-45deg); }
      28% { transform: scale(1) rotate(-45deg); }
      42% { transform: scale(1.15) rotate(-45deg); }
      70% { transform: scale(1) rotate(-45deg); }
    }

    .heart-wrapper:hover .heart {
      filter: drop-shadow(0 0 40px rgba(255, 42, 95, 1));
    }

    .click-hint {
      font-size: 0.95rem;
      color: #ff85a1;
      animation: bounce 2s infinite;
      margin-top: 20px;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* بطاقة الرسالة الظاهرة عند الضغط */
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    .card.active {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    .card h2 {
      font-family: 'Reem Kufi', sans-serif;
      color: #ff4d6d;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #f8edeb;
      margin-bottom: 20px;
    }

    .close-btn {
      background: linear-gradient(45deg, #ff2a5f, #ff758f);
      border: none;
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .close-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 42, 95, 0.6);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- العنصر الرئيسي -->
  <div class="container" id="mainContainer">
    <p class="title">اضغط على القلب لفتح الرسالة 💌</p>
    
    <div class="heart-wrapper" onclick="openHeart()">
      <div class="heart"></div>
    </div>

    <p class="click-hint">Tap the heart</p>
  </div>

  <!-- بطاقة الرسالة -->
  <div class="card" id="messageCard">
    <h2>إلى احلى رهوفة ❤️</h2>
    <p>
      هاي ماميي شلونج ، ردت بس اكلج كل يوم وانتي بخيرر لان كل يوم انتي بي موجودة بالنسبة الي عيدد وبسسس I love you mamaaa
    </p>
    <button class="close-btn" onclick="closeHeart()">إغلاق</button>
  </div>

  <script>
    // إنشاء الصوت واستدعاؤه عبر الرابط المباشر
    const audio = new Audio('https://d.top4top.io/m_38995z6dp1.mp3');
    audio.loop = true;

    const card = document.getElementById('messageCard');

    function openHeart() {
      // تشغيل الصوت فوراً
      audio.play().catch(function(error) {
        console.log("Audio play error: ", error);
      });

      // إظهار بطاقة الرسالة
      card.classList.add('active');

      // إطلاق إفكت تساقط القلوب
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        confetti({
          particleCount: 3,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#ff2a5f', '#ff758f', '#ffffff', '#c9184a']
        });
      }, 150);
    }

    function closeHeart() {
      card.classList.remove('active');
    }
  </script>
</body>
</html>
